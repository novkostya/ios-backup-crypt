name: ci

# The same gate as local dev — CI calls only `make` targets (no logic here), and the
# gate runs inside the pinned Go toolchain container the Makefile builds from
# deploy/Dockerfile. Running from a fresh checkout is what proves the fresh-clone
# property. The toolchain version is pinned in versions.env.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      # v5+ runs on Node 24; v4 pinned the now-deprecated Node 20 runtime.
      - uses: actions/checkout@v5
      # Docker (with buildkit) is preinstalled on ubuntu-latest; the Makefile autodetects
      # it and runs each gate in its toolchain container. No language setup needed.
      - name: Gate ladder (Go)
        run: make gates
      - name: Differential vs the Python reference (rung 3)
        run: make gates-diff
